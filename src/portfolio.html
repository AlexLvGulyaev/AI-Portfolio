  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600<link rel="stylesheet" href="css/styles.css">display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header__content">
      <a href="index.html" class="header__logo">
        <span class="logo__icon">◇</span>
        <span>AI Portfolio</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav__link">Главная</a>
        <a href="portfolio.html" class="nav__link nav__link--active">Проекты</a>
        <a href="services.html" class="nav__link">Услуги</a>
        <a href="contacts.html" class="nav__link">Контакты</a>
      </nav>
    </div>
  </header>

  <!-- Main -->
  <main class="main">
    <div class="page">
      <!-- Portfolio -->
      <section class="section section--compact">
        <div class="container">
          <div class="section__header" style="margin-bottom: var(--space-md);">
            <h1 class="section__title">Проекты</h1>
          </div>

          <div class="cards-grid" data-project-cards>
            <p class="case-card__excerpt">Загрузка проектов...</p>
          </div>
        </div>
      </section>

      <!-- CTA -->
      <section class="section section--compact">
        <div class="container text-center">
          <a href="contacts.html" class="btn btn-primary">Обсудить проект</a>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer__content">
      <p class="footer__copyright">© 2026 AI Automation Portfolio Lab</p>
      <nav class="footer__links">
        <a href="portfolio.html" class="footer__link">Проекты</a>
        <a href="services.html" class="footer__link">Услуги</a>
        <a href="contacts.html" class="footer__link">Контакты</a>
      </nav>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/project-cards.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/chat-widget.js"></script>

  <!-- Chat Launcher Button -->
  <button class="chat-launcher" id="chat-launcher" aria-label="Открыть AI-ассистента">
    <span>💬</span>
  </button>

  <!-- Chat Widget -->
  <div class="chat-widget" id="chat-widget">
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">AI</div>
        <div>
          <div class="chat-title">AI-ассистент</div>
          <div class="chat-subtitle">Спросите о кейсах и услугах</div>
        </div>
      </div>
      <button class="chat-close" id="chat-close" aria-label="Закрыть чат">×</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-footer">
      <input
        id="chat-input"
        class="chat-input"
        placeholder="Напишите вопрос..."
        type="text"
      />
      <button id="chat-send" class="chat-send">
        <span>➤</span>
      </button>
    </div>
  </div>
</body>
</html>
