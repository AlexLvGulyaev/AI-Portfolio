# Rate limit публичных API-эндпойнтов (находка 03.09.2026: поле
# rate_limit_requests_per_minute в конфиге backend не применялось ни одним
# контуром — публичные эндпойнты работали без ограничений).
# Зона по IP клиента: 10 запросов/мин (как задумано в конфиге),
# burst гасит веер запросов при загрузке страницы.
limit_req_zone $binary_remote_addr zone=aip_public_api:10m rate=10r/m;

# Traefik — edge-прокси (TLS): без real_ip nginx видел бы IP Traefik,
# и лимит стал бы общим на всех зрителей. Восстанавливаем IP клиента
# из X-Forwarded-For; доверяем только докерной сети edge (n8n_default).
set_real_ip_from 172.18.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 80;
    server_name ai.alex-n8n.site;
    root /usr/share/nginx/html;
    index index.html;

    # Превышение лимита — 429 Too Many Requests (не 503, чтобы
    # отличать лимит от деградации backend)
    limit_req_status 429;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Cache static assets.
    # Картинки и шрифты неизменяемы — 1 год, immutable.
    # JS/CSS меняются с каждым деплоем — no-cache: браузер ревалидирует
    # по ETag (304, без тела). Без этого возвращающиеся зрители держали
    # бы старый код до года (находка 03.09.2026: CTA виджета не был виден
    # из-за закешированного chat-widget.js).
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # HTML-документы тоже no-cache: без заголовка браузер кеширует их
    # эвристически, и возвращающийся зритель получает старый index.html
    # со старым JS (находка 03.09.2026: тулбар подбора не гасился
    # «Вернуть исходную матрицу» из-за закешированного index.html).
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location = / {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to backend API
    location /chat {
        limit_req zone=aip_public_api burst=20 nodelay;
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy to backend health endpoint
    location /health {
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy public project cards API
    location /project-cards {
        limit_req zone=aip_public_api burst=20 nodelay;
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy visit tracking endpoint
    location /track-visit {
        limit_req zone=aip_public_api burst=20 nodelay;
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy presale event tracking (case_view / inquiry, §4.5)
    location /track-event {
        limit_req zone=aip_public_api burst=20 nodelay;
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Панель документа: фрагмент md с подсветкой цитированного чанка
    location /document-fragment {
        limit_req zone=aip_public_api burst=20 nodelay;
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy Morphic probe: подбор кейсов под задачу (POST /case-match)
    location /case-match {
        limit_req zone=aip_public_api burst=20 nodelay;
        proxy_pass http://ai-portfolio-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Подбор идёт через retrieval + LLM — таймауты как у /chat
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy root API endpoint
    location = /api {
        proxy_pass http://ai-portfolio-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy admin API to backend
    location /api/admin/ {
        proxy_pass http://ai-portfolio-backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin SPA: static files with fallback to index.html
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Try files first, then fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
    }
}