<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="576" viewBox="0 0 480 576">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 17.6px; font-weight: 600; fill: #f0f6fc; text-anchor: middle; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13.6px; font-weight: 500; fill: #f0f6fc; text-anchor: end; dominant-baseline: middle; }
      .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20.8px; font-weight: 700; fill: #f0f6fc; text-anchor: middle; dominant-baseline: middle; }
      .pass { fill: #238636; }
      .fail { fill: #da3633; }
      .na { fill: #6e7681; }
      .cell { stroke: #0d1117; stroke-width: 2.4; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.2px; fill: #8b949e; dominant-baseline: middle; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.6px; fill: #8b949e; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="480" height="576" rx="6.4"/>

  <!-- Title -->
  <text x="240" y="33.6" class="title">Experiment 002 — Negative Smoke</text>

  <!-- Column header -->
  <rect x="184" y="54.4" width="240" height="35.2" fill="#161b22" rx="3.2" stroke="#30363d" stroke-width="1.2"/>
  <text x="304" y="72" class="value" style="font-size: 14.4px; fill: #c9d1d9;">Exp 002</text>

  <!-- Row 1: Positive -->
  <rect class="cell pass" x="184" y="99.2" width="240" height="64" rx="3.2"/>
  <text x="160" y="131.2" class="label">Positive</text>
  <text x="304" y="131.2" class="value">PASS</text>

  <!-- Row 2: Obvious Negative -->
  <rect class="cell fail" x="184" y="168.8" width="240" height="64" rx="3.2"/>
  <text x="160" y="200.8" class="label">Obvious Negative</text>
  <text x="304" y="200.8" class="value">FAIL</text>

  <!-- Row 3: Hard Negative -->
  <rect class="cell fail" x="184" y="238.4" width="240" height="64" rx="3.2"/>
  <text x="160" y="270.4" class="label">Hard Negative</text>
  <text x="304" y="270.4" class="value">FAIL</text>

  <!-- Row 4: Edge Case -->
  <rect class="cell fail" x="184" y="308" width="240" height="64" rx="3.2"/>
  <text x="160" y="340" class="label">Edge Case</text>
  <text x="304" y="340" class="value">FAIL</text>

  <!-- Row 5: Invalid Input -->
  <rect class="cell fail" x="184" y="377.6" width="240" height="64" rx="3.2"/>
  <text x="160" y="409.6" class="label">Invalid Input</text>
  <text x="304" y="409.6" class="value">FAIL</text>

  <!-- Row 6: Stability Repeat -->
  <rect class="cell na" x="184" y="447.2" width="240" height="64" rx="3.2"/>
  <text x="160" y="479.2" class="label">Stability Repeat</text>
  <text x="304" y="479.2" class="value" style="font-size: 19.2px;">N/A</text>

  <!-- Legend -->
  <rect x="184" y="527.2" width="19.2" height="12.8" fill="#238636" rx="1.6"/>
  <text x="211.2" y="533.6" class="legend-text">PASS</text>

  <rect x="264" y="527.2" width="19.2" height="12.8" fill="#da3633" rx="1.6"/>
  <text x="291.2" y="533.6" class="legend-text">FAIL</text>

  <rect x="344" y="527.2" width="19.2" height="12.8" fill="#6e7681" rx="1.6"/>
  <text x="371.2" y="533.6" class="legend-text">N/A</text>

  <!-- Footer -->
  <text x="240" y="560" class="footer">Source: FINETUNING_ENGINEERING_REPORT.md — Runtime Validation (Exp 002)</text>
