<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #f0f6fc; text-anchor: middle; }
      .axis-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #8b949e; }
      .tick { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #6e7681; }
      .quadrant-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #6e7681; text-anchor: middle; }
      .point-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f0f6fc; text-anchor: middle; }
      .point-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
      .baseline { fill: #f85149; }
      .hard-neg { fill: #4ecdc4; }
      .arrow { fill: none; stroke: #f0f6fc; stroke-width: 2; stroke-dasharray: 5,4; marker-end: url(#arrowhead); }
      .grid { stroke: #30363d; stroke-width: 1; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f0f6fc"/>
    </marker>
  </defs>

  <rect class="bg" width="640" height="520" rx="8"/>

  <!-- Title -->
  <text x="320" y="34" class="title">Precision / recall trade-off</text>

  <!-- Chart area background quadrants -->
  <rect x="80" y="70" width="240" height="180" fill="#1c2128" rx="4"/>
  <rect x="320" y="70" width="240" height="180" fill="#1c2128" rx="4"/>
  <rect x="80" y="250" width="240" height="180" fill="#1c2128" rx="4"/>
  <rect x="320" y="250" width="240" height="180" fill="#1c2128" rx="4"/>

  <!-- Grid lines -->
  <line class="grid" x1="80" y1="250" x2="560" y2="250"/>
  <line class="grid" x1="320" y1="70" x2="320" y2="430"/>

  <!-- Axes -->
  <line x1="80" y1="430" x2="560" y2="430" stroke="#8b949e" stroke-width="2"/>
  <line x1="80" y1="430" x2="80" y2="70" stroke="#8b949e" stroke-width="2"/>

  <!-- Axis labels -->
  <text x="320" y="460" class="axis-label" text-anchor="middle">Precision →</text>
  <text x="48" y="250" class="axis-label" text-anchor="middle" transform="rotate(-90 48 250)">Recall →</text>

  <!-- Axis ticks -->
  <text x="80" y="448" class="tick" text-anchor="middle">low</text>
  <text x="560" y="448" class="tick" text-anchor="middle">high</text>

  <text x="70" y="434" class="tick" text-anchor="end">low</text>
  <text x="70" y="76" class="tick" text-anchor="end">high</text>

  <!-- Quadrant labels — pressed to central horizontal axis -->
  <text x="200" y="240" class="quadrant-label">Low precision, high recall</text>
  <text x="440" y="240" class="quadrant-label">High precision, high recall</text>
  <text x="200" y="270" class="quadrant-label">Low precision, low recall</text>
  <text x="440" y="270" class="quadrant-label">High precision, low recall</text>

  <!-- Trend arrow -->
  <path class="arrow" d="M 160 140 C 240 140, 360 320, 440 320"/>

  <!-- Point 1: Exp 001/002 baseline -->
  <circle class="baseline" cx="160" cy="140" r="10"/>
  <circle cx="160" cy="140" r="14" fill="none" stroke="#f85149" stroke-width="2" opacity="0.5"/>
  <text x="160" y="175" class="point-label" style="fill: #f85149;">Exp 001/002 baseline</text>
  <text x="160" y="190" class="point-sub">FP ↑ — пропускает ловушки</text>

  <!-- Point 2: Exp 003 hard negatives -->
  <circle class="hard-neg" cx="440" cy="320" r="10"/>
  <circle cx="440" cy="320" r="14" fill="none" stroke="#4ecdc4" stroke-width="2" opacity="0.5"/>
  <text x="440" y="355" class="point-label" style="fill: #4ecdc4;">Exp 003 hard negatives</text>
  <text x="440" y="370" class="point-sub">FN ↑ — отсеивает истинные match</text>

  <!-- Footer -->
  <text x="320" y="495" class="footer">Качественная диаграмма trade-off; точки отражают направление смещения, а не точные цифры.</text>
</svg>
