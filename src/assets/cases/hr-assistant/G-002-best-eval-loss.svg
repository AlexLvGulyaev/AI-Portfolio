<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Exp 001 vs 002: higher eval loss, higher decision accuracy">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ffffff"/></marker></defs>
<rect width="900" height="420" fill="#0d0d10" rx="8"/>
<text x="30" y="34" fill="#e8e8ec" font-size="20" font-family="Inter, sans-serif" text-anchor="start" font-weight="600">Exp 001 vs 002: парадокс метрик</text>
<text x="30" y="62" fill="#8a8a9a" font-size="13" font-family="Inter, sans-serif" text-anchor="start" font-weight="normal">Higher eval loss, but higher decision accuracy</text>

<!-- Eval Loss panel -->
<rect x="50" y="95" width="380" height="260" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="6"/>
<text x="240" y="128" fill="#ffffff" font-size="15" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Best Eval Loss</text>
<line x1="60" y1="330" x2="420" y2="330" stroke="#2a2a36" stroke-width="1"/>
<text x="50" y="334" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">0.00</text>
<line x1="60" y1="283" x2="420" y2="283" stroke="#2a2a36" stroke-width="1"/>
<text x="50" y="287" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">0.25</text>
<line x1="60" y1="236" x2="420" y2="236" stroke="#2a2a36" stroke-width="1"/>
<text x="50" y="240" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">0.50</text>
<line x1="60" y1="189" x2="420" y2="189" stroke="#2a2a36" stroke-width="1"/>
<text x="50" y="193" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">0.75</text>
<line x1="60" y1="142" x2="420" y2="142" stroke="#2a2a36" stroke-width="1"/>
<text x="50" y="146" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">1.00</text>

<!-- Exp 001 bar: 0.235 -->
<rect x="120" y="264" width="70" height="66" fill="#4ECDC4" opacity="0.85" rx="4"/>
<text x="155" y="300" fill="#0d0d10" font-size="14" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">0.235</text>
<text x="155" y="350" fill="#e8e8ec" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 001</text>

<!-- Exp 002 bar: 0.444 -->
<rect x="290" y="205" width="70" height="125" fill="#FFB347" opacity="0.85" rx="4"/>
<text x="325" y="267" fill="#0d0d10" font-size="14" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">0.444</text>
<text x="325" y="350" fill="#e8e8ec" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 002</text>

<!-- Decision Accuracy panel -->
<rect x="470" y="95" width="380" height="260" fill="#1a1a24" stroke="#2a2a36" stroke-width="1" rx="6"/>
<text x="660" y="128" fill="#ffffff" font-size="15" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Decision Accuracy</text>
<line x1="480" y1="330" x2="840" y2="330" stroke="#2a2a36" stroke-width="1"/>
<text x="470" y="334" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">0%</text>
