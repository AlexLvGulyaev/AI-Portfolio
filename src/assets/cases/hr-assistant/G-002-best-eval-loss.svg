<text x="470" y="193" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">75%</text>
<line x1="480" y1="142" x2="840" y2="142" stroke="#2a2a36" stroke-width="1"/>
<text x="470" y="146" fill="#8a8a9a" font-size="10" font-family="Inter, sans-serif" text-anchor="end" font-weight="normal">100%</text>

<!-- Exp 001 bar: 44% -->
<rect x="540" y="245" width="70" height="85" fill="#FF6B6B" opacity="0.85" rx="4"/>
<text x="575" y="282" fill="#ffffff" font-size="14" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">44%</text>
<text x="575" y="350" fill="#e8e8ec" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 001</text>

