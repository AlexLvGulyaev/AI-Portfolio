<rect x="710" y="169" width="70" height="161" fill="#96CEB4" opacity="0.85" rx="4"/>
<text x="745" y="235" fill="#0d0d10" font-size="14" font-family="Inter, sans-serif" text-anchor="middle" font-weight="700">78%</text>
<text x="745" y="350" fill="#e8e8ec" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="600">Exp 002</text>

<!-- X-axis labels -->
<text x="240" y="376" fill="#8a8a9a" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">experiments</text>
<text x="660" y="376" fill="#8a8a9a" font-size="12" font-family="Inter, sans-serif" text-anchor="middle" font-weight="normal">experiments</text>
</svg>